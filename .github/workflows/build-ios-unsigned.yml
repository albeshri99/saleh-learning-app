name: Build unsigned Saleh IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore project source
        run: |
          cat source_parts/part-*.bin > saleh-ios-source.zip
          mkdir saleh_app
          unzip -q saleh-ios-source.zip -d saleh_app
          cp patches/saleh_video_renderer.dart saleh_app/lib/features/character/video/saleh_video_renderer.dart

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build unsigned iOS app
        working-directory: saleh_app
        run: |
          flutter pub get
          flutter analyze
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R saleh_app/build/ios/iphoneos/Runner.app Payload/Runner.app
          /usr/bin/zip -qry Saleh-unsigned.ipa Payload
          shasum -a 256 Saleh-unsigned.ipa > Saleh-unsigned.ipa.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Saleh-iOS-unsigned
          path: |
            Saleh-unsigned.ipa
            Saleh-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
