name: Build unsigned Saleh IPA

on:
  push:
    branches: [main, ipa-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore project source
        run: |
          cat source_parts_v3/part_* > saleh-ios-source.zip
          cat patch_parts_v5/part_* > saleh-ios-patch-v5.zip
          echo "D4F15538011EF3BE6763CFB62DB8E1EF656CA47CDD0ED7E5754E5260A1A104FB  saleh-ios-source.zip" | shasum -a 256 -c -
          echo "A5FC86A0E5FFE927DBE3D66E2ECE2336236FE5414207A5BC19EB9199B4C92D2E  saleh-ios-patch-v5.zip" | shasum -a 256 -c -
          mkdir saleh_app
          unzip -q saleh-ios-source.zip -d saleh_app
          unzip -qo saleh-ios-patch-v5.zip -d saleh_app
          cp -R patch_v7/. saleh_app/
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify and build unsigned iOS app
        working-directory: saleh_app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R saleh_app/build/ios/iphoneos/Runner.app Payload/Runner.app
          /usr/bin/zip -qry Saleh-unsigned-v7.ipa Payload
          shasum -a 256 Saleh-unsigned-v7.ipa > Saleh-unsigned-v7.ipa.sha256
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Saleh-iOS-unsigned-v7
          path: |
            Saleh-unsigned-v7.ipa
            Saleh-unsigned-v7.ipa.sha256
          if-no-files-found: error
          retention-days: 14
